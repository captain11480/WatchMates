<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Room - VibeMates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">VibeMates</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="joinroom.html">Join Room</a>
                <a href="online.html">Online Movies</a>
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </div>

    <!-- Join Room Section -->
    <div class="container">
        <section class="join-container">
            <div class="room-cards">
                <!-- Create Room Card -->
                <div class="room-card fade-in">
                    <h2>Create Room</h2>
                    <form id="createRoomForm">
                        <div class="form-group">
                            <label for="roomName">Room Name</label>
                            <input type="text" id="roomName" class="form-control" placeholder="e.g., Friday Movie Night" required>
                        </div>
                        <div class="form-group">
                            <label for="createNickname">Your Nickname</label>
                            <input type="text" id="createNickname" class="form-control" placeholder="Enter your nickname" required>
                        </div>
                        <div id="roomCodeDisplay" class="room-code-display" style="display: none;">
                            <div class="success-message">
                                <i class="fas fa-check-circle"></i>
                                <span>Room created successfully!</span>
                            </div>
                            <div class="code-container">
                                <strong>Your room code:</strong>
                                <div class="room-code" id="generatedRoomCode"></div>
                            </div>
                            <div class="redirect-message">
                                <i class="fas fa-spinner fa-spin"></i>
                                Redirecting to watch room...
                            </div>
                        </div>
                        <button type="submit" class="btn" id="createRoomBtn">Create Room</button>
                    </form>
                </div>

                <!-- Join Room Card -->
                <div class="room-card fade-in">
                    <h2>Join Room</h2>
                    <form id="joinRoomForm">
                        <div class="form-group">
                            <label for="roomCode">Room Code</label>
                            <input type="text" id="roomCode" class="form-control" placeholder="Enter 6-character code" required maxlength="6">
                        </div>
                        <div class="form-group">
                            <label for="joinNickname">Your Nickname</label>
                            <input type="text" id="joinNickname" class="form-control" placeholder="Enter your nickname" required>
                        </div>
                        <div id="joinAlert" class="alert alert-danger" style="display: none;">
                            <i class="fas fa-exclamation-circle"></i>
                            Room not found. Please check the code.
                        </div>
                        <button type="submit" class="btn">Join Room</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 VibeMates. Watch together, anywhere.</p>
        </div>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/main.js"></script>
    <script>
        const socket = io();
        
        // ============================================
        // CREATE ROOM - FIXED
        // ============================================
        const createForm = document.getElementById('createRoomForm');
        if (createForm) {
            createForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const roomName = document.getElementById('roomName').value.trim();
                const nickname = document.getElementById('createNickname').value.trim();
                
                if (!roomName || !nickname) {
                    alert('Please fill all fields');
                    return;
                }
                
                const submitBtn = document.getElementById('createRoomBtn');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
                submitBtn.disabled = true;
                
                console.log('📤 Creating room:', { roomName, nickname });
                socket.emit('createRoom', { roomName, nickname });
                
                socket.once('roomCreated', (data) => {
                    console.log('✅ Room created:', data);
                    window.location.href = `watchroom.html?room=${data.roomCode}&name=${encodeURIComponent(nickname)}`;
                });
                
                socket.once('error', (data) => {
                    console.error('❌ Error:', data);
                    alert(data.message || 'Failed to create room');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                });
                
                // Safety timeout
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }, 8000);
            });
        }
        
        // ============================================
        // JOIN ROOM - FIXED
        // ============================================
        const joinForm = document.getElementById('joinRoomForm');
        if (joinForm) {
            joinForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const roomCode = document.getElementById('roomCode').value.trim().toUpperCase();
                const nickname = document.getElementById('joinNickname').value.trim();
                
                if (!roomCode || !nickname) {
                    alert('Please fill all fields');
                    return;
                }
                
                if (roomCode.length !== 6) {
                    alert('Room code must be 6 characters');
                    return;
                }
                
                const submitBtn = joinForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Joining...';
                submitBtn.disabled = true;
                
                console.log('📤 Joining room:', { roomCode, nickname });
                
                // First try YouTube room
                socket.emit('joinYoutubeRoom', { roomCode, nickname });
                
                let joined = false;
                
                socket.once('youtubeRoomJoined', (data) => {
                    console.log('✅ Joined YouTube room:', data);
                    joined = true;
                    window.location.href = `youtube-room.html?room=${data.roomCode}&name=${encodeURIComponent(nickname)}&video=${data.youtubeId}`;
                });
                
                // If not YouTube, try regular room after short delay
                setTimeout(() => {
                    if (!joined) {
                        socket.emit('joinRoom', { roomCode, nickname });
                        
                        socket.once('roomJoined', (data) => {
                            console.log('✅ Joined regular room:', data);
                            joined = true;
                            window.location.href = `watchroom.html?room=${data.roomCode}&name=${encodeURIComponent(nickname)}`;
                        });
                        
                        socket.once('roomNotFound', () => {
                            console.log('❌ Room not found');
                            const alertDiv = document.getElementById('joinAlert');
                            alertDiv.style.display = 'flex';
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            setTimeout(() => {
                                alertDiv.style.display = 'none';
                            }, 5000);
                        });
                    }
                }, 500);
                
                // Safety timeout
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }, 10000);
            });
        }
        
        // ============================================
        // THEME TOGGLE
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            const themeIcon = themeToggle.querySelector('i');
            const currentTheme = localStorage.getItem('theme') || 'light';
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
</body>
</html>
